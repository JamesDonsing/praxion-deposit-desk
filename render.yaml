services:
  - type: web
    name: praxion-deposit-desk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:get_app --factory --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_INVOICER_EMAIL
        sync: false
      - key: SANDBOX_BUYER_EMAIL
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DATABASE_PATH
        value: /tmp/deposit_desk.db
